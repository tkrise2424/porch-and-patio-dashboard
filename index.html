<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porch + Patio — MMai Report #4</title>
<style>
:root {--bg:#f5f6fa;--card:#fff;--text:#1a1f2e;--sub:#666;--accent:#1565c0;--good:#2e7d32;--warn:#c62828;--border:#e0e3eb;--badge:#1565c0;--draft:#f57f17}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.container{max-width:1100px;margin:0 auto;padding:20px}
.header{background:linear-gradient(135deg,#1a1f2e 0%,#2d3748 100%);color:#fff;padding:28px 24px;border-radius:12px;margin-bottom:20px}
.header h1{font-size:1.6rem;font-weight:700;margin-bottom:4px}
.header .meta{font-size:0.85rem;opacity:0.75;margin-top:6px}
.header .meta a{color:#fff;opacity:0.7}
.badge-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.badge{background:rgba(255,255,255,0.15);padding:4px 12px;border-radius:20px;font-size:0.78rem}
.section{background:var(--card);border-radius:10px;padding:20px 24px;margin-bottom:16px;border:1px solid var(--border)}
.section-title{font-size:1.1rem;font-weight:700;margin-bottom:14px;color:var(--text)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.kpi-card{background:#f8f9fb;border-radius:8px;padding:14px;text-align:center}
.kpi-label{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--sub);margin-bottom:4px}
.kpi-value{font-size:1.8rem;font-weight:700;color:var(--text)}
.kpi-sub{font-size:0.72rem;color:var(--sub);margin-top:2px}
.kpi-delta{font-size:0.75rem;font-weight:600;margin-top:4px}
.kpi-d-pos{color:var(--good)}
.kpi-d-neg{color:var(--warn)}
.m-warn{color:var(--warn)!important}
.m-good{color:var(--good)!important}
.alert-banner{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:0.9rem}
.alert-good{background:#e8f5e9;border-left:4px solid var(--good);color:#1b5e20}
.alert-warn{background:#fff3e0;border-left:4px solid #f57c00;color:#e65100}
.note-callout{font-size:0.82rem;color:var(--sub);background:#f8f9fb;padding:10px 14px;border-radius:6px;line-height:1.5}
.seq-table,.ga-table,.coverage-table{width:100%;border-collapse:collapse;font-size:0.82rem}
.seq-table th,.ga-table th,.coverage-table th{background:#f1f3f8;padding:8px 10px;text-align:left;font-weight:600;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--sub);border-bottom:2px solid var(--border)}
.seq-table td,.ga-table td,.coverage-table td{padding:8px 10px;border-bottom:1px solid var(--border)}
.seq-name{font-weight:600;font-size:0.85rem}
.seq-note{font-size:0.72rem;color:var(--sub)}
.s-active{background:#e8f5e9;color:#1b5e20;padding:2px 8px;border-radius:10px;font-size:0.7rem;font-weight:600}
.s-paused{background:#fff3e0;color:#e65100;padding:2px 8px;border-radius:10px;font-size:0.7rem;font-weight:600}
.s-draft{background:#fff8e1;color:var(--draft);padding:2px 8px;border-radius:10px;font-size:0.7rem;font-weight:600}
.ga-total{background:#f1f3f8;font-weight:700}
.insights-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.insight-card{border-left:3px solid var(--accent);background:#f8f9fb;padding:12px 14px;border-radius:0 8px 8px 0;font-size:0.85rem}
.ic-body{line-height:1.5}
.ns-list{list-style:none;padding:0}
.ns-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.ns-item:last-child{border-bottom:none}
.ns-prio{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0}
.ns-action{font-size:0.88rem;line-height:1.5}
.done-check{color:var(--good)}
.def-card{background:#f8f9fb;border-radius:6px;padding:10px 14px;margin-bottom:6px}
.def-name{font-weight:600;font-size:0.82rem;margin-bottom:2px}
.def-desc{font-size:0.75rem;color:var(--sub);line-height:1.5}
.error{color:var(--warn);padding:20px;text-align:center}
.cov-found{background:#f1f8e9}
.cov-added{background:#e3f2fd}
@media(max-width:600px){.kpi-grid{grid-template-columns:1fr 1fr}.insights-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Porch + Patio</h1>
<div id="periodLabel" style="font-size:1rem;opacity:0.85"></div>
<div class="meta" id="reportMeta"></div>
<div class="badge-row">
<span class="badge" id="badgeType"></span>
<span class="badge" id="badgeBaseline"></span>
</div>
</div>

<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px">
<div class="kpi-card"><div class="kpi-label">Type</div><div class="kpi-value" style="font-size:1rem" id="cbType"></div></div>
<div class="kpi-card"><div class="kpi-label">Period</div><div class="kpi-value" style="font-size:1rem" id="cbPeriod"></div></div>
<div class="kpi-card"><div class="kpi-label">Duration</div><div class="kpi-value" style="font-size:1rem" id="cbDays"></div></div>
<div class="kpi-card"><div class="kpi-label">Baseline</div><div class="kpi-value" style="font-size:1rem" id="cbBaselinePeriod"></div></div>
<div class="kpi-card"><div class="kpi-label">Next Report</div><div class="kpi-value" style="font-size:1rem" id="cbNext"></div></div>
</div>

<div id="mainContent"></div>
</div>

<script>
fetch('report.json?v=9')
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(function(d){
var r=d.report,ov=d.overview,cp=d.comparison,pd=cp.periodDelta,seqs=d.sequences,ins=d.insights,ns=d.nextSteps,notes=d.notes;
var lm=d.listMaintenance,ga=d.googleAnalytics,dv=d.deliverability;

document.getElementById('periodLabel').textContent = r.periodLabel + ' — #' + r.reportNumber;
document.getElementById('badgeType').textContent = r.periodLabel;
document.getElementById('badgeBaseline').textContent = 'Baseline: ' + cp.baseline.period;
document.getElementById('reportMeta').innerHTML =
  '<strong>Generated:</strong> ' + r.generated +
  '<br><strong>Dashboard:</strong> <a href="' + r.dashboardUrl + '" style="color:#fff;opacity:0.7">' + r.dashboardUrl + '</a>';

document.getElementById('cbType').textContent = r.periodLabel;
document.getElementById('cbPeriod').textContent = r.periodStart + ' — ' + r.periodEnd;
document.getElementById('cbDays').textContent = r.periodDays + '-Day Period';
document.getElementById('cbBaselinePeriod').textContent = cp.baseline.period;
document.getElementById('cbNext').textContent = notes.nextReport;

var h = '';

var activeCount = seqs.filter(function(s){return s.status==='ACTIVE'}).length;
var pausedCount = seqs.filter(function(s){return s.status==='PAUSED'}).length;
var draftCount = seqs.filter(function(s){return s.status==='DRAFT'}).length;
h += '<div class="alert-banner alert-good"><h3>' + activeCount + ' ACTIVE SEQUENCES SENDING (' + pausedCount + ' paused, ' + draftCount + ' draft)</h3><p>' + (notes.sequenceChanges||'') + '</p></div>';

h += '<div class="section"><div class="section-title">📊 Pipeline Overview</div><div class="kpi-grid">';
h += kc('Total Members', ov.totalMembers, 'across ' + ov.totalSequences + ' sequences');
h += kc('Completed', ov.completedMembers, 'all steps finished');
h += kc('In Progress', ov.inProgressMembers, 'mid-sequence');
h += kc('Total Sent', ov.totalSent.toLocaleString(), 'across all sequences');
h += kc('Active Sequences', ov.activeSequences + ' of ' + ov.totalSequences, ov.pausedSequences + ' paused');
h += '</div></div>';

h += '<div class="section"><div class="section-title">📈 Engagement Overview</div><div class="kpi-grid">';
h += kc('Unique Opens', ov.totalUniqueOpens, 'overall OR: ' + ov.openRate + '%');
h += kc('Unique Clicks', ov.totalUniqueClicks, 'overall CR: ' + ov.clickRate + '%');
h += kc('Total Replies', ov.totalReplies, 'across all sequences');
h += kc('Total Bounces', ov.totalBounces, 'overall BR: ' + ov.bounceRate + '%');
h += kc('Out of Office', ov.totalOOO, 'auto-replies');
h += kc('Bookings', ov.totalBookings, '<span style="color:#888">retail model — N/A</span>');
h += '</div>';
h += '<div class="note-callout" style="margin-top:12px"><strong>Conversion Model:</strong> ' + ov.bookingTrackingNote + '</div></div>';

h += '<div class="section"><div class="section-title">💬 SMS Channel</div>';
h += '<div class="note-callout"><strong>SMS Note:</strong> ' + notes.smsNote + '</div></div>';

h += '<div class="section"><div class="section-title">📅 Period-over-Period Comparison</div><div class="kpi-grid">';
h += cmp('Executions', cp.current.executions.toLocaleString(), cp.baseline.executions.toLocaleString(), pd.executions);
h += cmp('Bounces', cp.current.bounces, cp.baseline.bounces, pd.bounces + ' (' + pd.bounceRate + ')');
h += cmp('Replies', cp.current.replies, cp.baseline.replies, String(pd.replies));
h += cmp('Open Rate', cp.current.openRate + '%', cp.baseline.openRate + '%', pd.openRate);
h += cmp('Click Rate', cp.current.clickRate + '%', cp.baseline.clickRate + '%', pd.clickRate);
h += '</div></div>';

h += '<div class="section"><div class="section-title">🔄 Sequence Status & Performance</div>';
h += '<div style="overflow-x:auto"><table class="seq-table"><thead><tr>';
h += '<th>Sequence</th><th>Status</th><th>Members</th><th>Sent</th><th>Opens</th><th>OR</th><th>Clicks</th><th>CR</th><th>Bounces</th><th>BR</th><th>Replies</th></tr></thead><tbody>';
seqs.forEach(function(s) {
  var statusHtml = s.status==='ACTIVE' ? '<span class="s-active">'+s.status+'</span>' :
                   s.status==='PAUSED' ? '<span class="s-paused">'+s.status+'</span>' :
                   '<span class="s-draft">'+s.status+'</span>';
  h += '<tr>';
  h += '<td><div class="seq-name">' + s.name + '</div><div class="seq-note">' + s.note + '</div>';
  if(s.delta && s.delta.note) {
    h += '<div style="font-size:0.7rem;color:#1565c0;margin-top:2px">' + s.delta.note + '</div>';
  } else if(s.delta) {
    h += '<div style="font-size:0.7rem;color:#999;margin-top:2px">Δ: ' + s.delta.sent + ' sends, ' + s.delta.opens + ' opens</div>';
  }
  h += '</td>';
  h += '<td>' + statusHtml + '</td>';
  h += '<td>' + s.members + '</td>';
  h += '<td>' + s.sent + '</td>';
  h += '<td>' + s.uniqueOpens + '</td>';
  h += '<td class="' + (s.openRate > 15 ? 'm-good' : '') + '">' + (typeof s.openRate==='number'?s.openRate.toFixed(2):s.openRate) + '%</td>';
  h += '<td>' + s.uniqueClicks + '</td>';
  h += '<td class="' + (s.clickRate > 2 ? 'm-good' : '') + '">' + (typeof s.clickRate==='number'?s.clickRate.toFixed(2):s.clickRate) + '%</td>';
  h += '<td class="' + (s.bounceRate > 10 ? 'm-warn' : '') + '">' + s.bounces + '</td>';
  h += '<td class="' + (s.bounceRate > 10 ? 'm-warn' : '') + '">' + (typeof s.bounceRate==='number'?s.bounceRate.toFixed(2):s.bounceRate) + '%</td>';
  h += '<td>' + s.replies + '</td>';
  h += '</tr>';
});
h += '</tbody></table></div>';
h += '<div class="note-callout" style="margin-top:16px"><strong>Notes:</strong> ' + notes.dataAvailability + '</div></div>';

if(lm) {
  h += '<div class="section"><div class="section-title">🧹 Customer List Maintenance — July 2026</div>';
  h += '<div class="note-callout" style="margin-bottom:16px">' + lm.note + '</div>';
  h += '<table class="coverage-table"><thead><tr><th>Step</th><th>Count</th><th>Result</th></tr></thead><tbody>';
  h += '<tr><td><strong>Starting records</strong></td><td>' + lm.startingCount.toLocaleString() + '</td><td>All active customer records merged into master list</td></tr>';
  h += '<tr class="cov-found"><td><strong>Duplicates removed</strong></td><td>−' + lm.duplicatesRemoved + '</td><td>' + lm.afterDedup.toLocaleString() + ' unique records after dedup</td></tr>';
  h += '<tr class="cov-added"><td><strong>Bouncing/blocked removed</strong></td><td>−' + lm.bouncingRemoved + '</td><td>Cross-referenced against recent campaign data</td></tr>';
  h += '<tr style="background:#f1f8e9;font-weight:700"><td><strong>Final clean list</strong></td><td><span class="done-check">' + lm.finalCount.toLocaleString() + '</span></td><td>Verified contacts loaded into customer database</td></tr>';
  h += '</tbody></table></div>';
}

if(ga) {
  h += '<div class="section"><div class="section-title">📱 Google Analytics — UTM Campaign Performance</div>';
  h += '<div class="note-callout" style="margin-bottom:16px"><strong>Source:</strong> ' + ga.source + ' | Data covers the reporting period</div>';

  h += '<div style="font-weight:700;color:#1a1f2e;margin-bottom:12px">Metric Definitions</div>';
  var defs = ga.metricDefinitions;
  Object.keys(defs).forEach(function(k){
    var d = defs[k];
    h += '<div class="def-card"><div class="def-name">' + d.label + '</div><div class="def-desc">' + d.definition + '</div></div>';
  });

  h += '<table class="ga-table" style="margin-top:16px"><thead><tr><th>Segment (Source)</th><th>Campaign ID</th><th>Event Count</th><th>Δ Events</th><th>Engaged</th><th>Sessions</th><th>Δ Sessions</th><th>Key Events</th></tr></thead><tbody>';
  ga.data.forEach(function(row,i){
    var isTotal = row.segment.indexOf('Total')===0;
    h += '<tr class="' + (isTotal?'ga-total':'') + '"><td><strong>' + row.segment + '</strong></td>';
    h += '<td>' + row.campaignId + '</td>';
    h += '<td>' + row.eventCount.toLocaleString() + '</td>';
    h += '<td style="' + (row.deltaEvents&&row.deltaEvents.indexOf('+')===0?'color:#2e7d32':'') + (row.deltaEvents&&row.deltaEvents.indexOf('-')===0?'color:#c62828':'') + (row.deltaEvents==='NEW'?'color:#1565c0;font-weight:600':'') + '">' + (row.deltaEvents||'') + '</td>';
    h += '<td>' + row.engagedSessions + '</td>';
    h += '<td>' + row.sessions + '</td>';
    h += '<td style="' + (row.deltaSessions&&row.deltaSessions.indexOf('+')===0?'color:#2e7d32':'') + (row.deltaSessions&&row.deltaSessions.indexOf('-')===0?'color:#c62828':'') + (row.deltaSessions==='NEW'?'color:#1565c0;font-weight:600':'') + '">' + (row.deltaSessions||'') + '</td>';
    h += '<td>' + row.keyEvents + '</td></tr>';
  });
  h += '</tbody></table>';

  if(ga.insights && ga.insights.length) {
    h += '<div style="font-weight:700;color:#1a1f2e;margin:16px 0 8px">Key Takeaways</div>';
    h += '<div class="insights-grid">';
    ga.insights.forEach(function(i){
      h += '<div class="insight-card" style="border-left-color:#1565c0"><div class="ic-body">' + i + '</div></div>';
    });
    h += '</div>';
  }
  h += '</div>';
}

if(dv) {
  h += '<div class="section"><div class="section-title">📬 Email Deliverability — Google Postmaster Tools</div>';
  h += '<div class="note-callout" style="margin-bottom:16px"><strong>Domain:</strong> porchandpationewsletter.com | ' + dv.note + '</div>';
  
  h += '<div class="kpi-grid" style="margin-bottom:16px">';
  h += kc('Spam Rate', '<span style="color:#2e7d32;font-weight:700">' + dv.spamRate.value + '</span>', 'User-reported spam');
  h += kc('Domain Rep', '<span style="color:#c62828;font-weight:700">' + dv.domainReputation.value + '</span>', 'Google rating');
  h += kc('Auth (DKIM/SPF/DMARC)', '<span style="color:#2e7d32;font-weight:700">' + dv.authentication.value + '</span>', 'All passing');
  h += kc('Delivery Errors', '<span style="color:#2e7d32;font-weight:700">' + dv.deliveryErrors.value + '</span>', 'Near-perfect');
  h += kc('TLS Encryption', '<span style="color:#2e7d32;font-weight:700">' + dv.encryption.value + '</span>', 'Inbound');
  h += '</div>';

  h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:16px">';
  var sections = [dv.spamRate, dv.domainReputation, dv.authentication, dv.encryption, dv.deliveryErrors];
  sections.forEach(function(s){
    var icon = s.status==='excellent' ? '✅' : s.status==='good' ? '👍' : '⚠️';
    h += '<div class="insight-card" style="border-left-color:' + (s.status==='excellent'?'#2e7d32':s.status==='warning'?'#f57c00':'#1565c0') + '"><div class="ic-body"><strong>' + icon + ' ' + s.label + ':</strong> ' + s.detail + '</div></div>';
  });
  h += '</div>';

  if(dv.insights && dv.insights.length) {
    h += '<div style="font-weight:700;color:#1a1f2e;margin:16px 0 8px">Key Takeaways</div>';
    h += '<div class="insights-grid">';
    dv.insights.forEach(function(i){
      h += '<div class="insight-card" style="border-left-color:#1565c0"><div class="ic-body">' + i + '</div></div>';
    });
    h += '</div>';
  }
  h += '</div>';
}

h += '<div class="section"><div class="section-title">💡 Key Insights</div><div class="insights-grid">';
ins.forEach(function(i) {
  var txt = typeof i === 'string' ? i : (i.title ? '<strong>' + i.title + '</strong><br>' + i.detail : i.detail || i);
  h += '<div class="insight-card"><div class="ic-body">' + txt + '</div></div>';
});
h += '</div></div>';

h += '<div class="section"><div class="section-title">✅ Recommended Next Steps</div><ul class="ns-list">';
ns.forEach(function(n, idx) {
  var txt = typeof n === 'string' ? n : n.action;
  var isDone = typeof txt === 'string' && txt.indexOf('✅') === 0;
  h += '<li class="ns-item"><div class="ns-prio" style="' + (isDone?'background:#4caf50':'') + '">' + (isDone?'✓':(idx+1)) + '</div><div><div class="ns-action' + (isDone?' done-check':'') + '">' + txt + '</div></div></li>';
});
h += '</ul></div>';

document.getElementById('mainContent').innerHTML = h;
}).catch(function(e){
  document.getElementById('mainContent').innerHTML = '<div class="error">Could not load report data: ' + e.message + '</div>';
});

function kc(label, value, sub, warn) {
  return '<div class="kpi-card"><div class="kpi-label">' + label + '</div><div class="kpi-value' + (warn ? ' m-warn' : '') + '">' + value + '</div><div class="kpi-sub">' + sub + '</div></div>';
}
function cmp(label, curr, base, delta, neg) {
  var dc = neg || (typeof delta === 'string' && delta.indexOf('-') === 0) ? 'kpi-d-neg' : 'kpi-d-pos';
  return '<div class="kpi-card"><div class="kpi-label">' + label + '</div><div class="kpi-value" style="font-size:1.4rem">' + curr + '</div><div class="kpi-sub">Baseline: ' + base + '</div><div class="kpi-delta ' + dc + '">Δ ' + delta + '</div></div>';
}
</script>
</body>
</html>
